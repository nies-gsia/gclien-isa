; Example configuration for gclien-isa-wfde5.exe (WFDE5 v2.1 input).
; Copy this file into bin\ (e.g. bin\config.ini) and edit the paths.
; Relative paths are resolved from bin\, because the executable changes the
; working directory to its own location at startup.

[System]
; Root directory of the WFDE5 v2.1 data. Files are read from
;   {Wfde5Dir}/{Var}/{Var}{FileNameStr}{YYYYMM}{FileVersion}.nc
; e.g. E:/WFDE5_v2.1/Tair/Tair_WFDE5_CRU_201008_v2.1.nc
Wfde5Dir = E:/WFDE5_v2.1
FileNameStr = _WFDE5_CRU_
FileVersion = _v2.1
; Output directory and bias-correction cache directory (both must exist).
OutPutDir = E:/gclien_output
AdjustDir = E:/gclien_output/Adjust
NumThreads = 8
; deflate compression level of the output NetCDF (0 = no compression).
NcCompLevel = 1
; Offset from UTC (hours) used only for log timestamps.
UtcOffsetHours = 9

[CalcWBGT]
; Parameters passed to calc_wbgt() (Liljegren et al., 2008).
; avg   : averaging time of the meteorological inputs (minutes)
; urban : 1 = urban, 0 = rural wind-speed power-law exponent
; zspeed: height of the wind speed (m)
; dT    : vertical temperature difference, upper minus lower (degC)
avg = 0
urban = 0
zspeed = 10.0
dT = 0.0
; Currently unused, but the key must be present.
ThresholdTair = 999
; Pseudo-global-warming offset (degC) added to air temperature in the WBGT
; calculation. 0 = disabled. A non-zero value adds pgw<value>_ to file names.
PGW = 0.0

[Output]
; Variables to compute and save (1 = save, 0 = skip). At least one must be 1.
SaveTair = 1
SaveWbgtSun = 1
; WBGT in the shade, approximated by setting solar radiation to 0.
SaveWbgtShade = 0
; Number of significant digits kept by lossy quantization (GranularBitRound)
; before compression. 0 = disabled (lossless). 3 to 4 is a reasonable choice
; for temperature and WBGT. Output stays plain float; no plugin is needed.
QuantizeNSD = 0

[Resolution]
; Number of grid cells of the full global output grid (0.05 deg = 7200 x 3600).
longitude = 7200
latitude = 3600
; Computation domain (required). Use -180/180/-90/90 for the whole globe.
lon_min = -180.0
lon_max = 180.0
lat_min = -90.0
lat_max = 90.0

[FeatureFile]
; Tab-separated list of static feature names and their NetCDF files.
FeatureList = ../input/input_features.txt
; Land mask; cells that are not land are skipped.
landmask = ../input/gridX/LandUse.sum.Type1.0.nc

[XgbModel]
; XGBoost models used for bias correction (JSON format).
air_temperature = ../input/xgb_models/xbg_model_air_temperature_variableset00_seed_0.json
relative_humidity = ../input/xgb_models/xbg_model_relative_humidity_variableset00_seed_0.json
station_pressure = ../input/xgb_models/xbg_model_station_pressure_variableset00_seed_0.json
wind_speed = ../input/xgb_models/xbg_model_wind_speed_variableset00_seed_0.json
