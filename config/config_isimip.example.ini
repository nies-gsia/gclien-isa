; Example configuration for gclien-isa-isimip.exe (ISIMIP3b input).
; Copy this file into bin\ (e.g. bin\config_isimip.ini) and edit the paths.
; Relative paths are resolved from bin\, because the executable changes the
; working directory to its own location at startup.
;
; Differences from the WFDE5 configuration:
;   - [System] uses Isimip3bDir instead of Wfde5Dir / FileNameStr / FileVersion.
;   - The scenario and GCM are given as command-line arguments, e.g.
;       gclien-isa-isimip.exe 2010 8 config_isimip.ini historical GFDL-ESM4
;   - See config_wfde5.example.ini for descriptions of the common keys.

[System]
; Root directory of the ISIMIP3b data. Files are searched in
;   {Isimip3bDir}/{scenario}/{gcm}/
Isimip3bDir = E:/ISIMIP3b
OutPutDir = E:/gclien_output
AdjustDir = E:/gclien_output/Adjust
NumThreads = 8
NcCompLevel = 1
UtcOffsetHours = 9

[CalcWBGT]
avg = 0
urban = 0
zspeed = 10.0
dT = 0.0
ThresholdTair = 999
PGW = 0.0

[Output]
SaveTair = 1
SaveWbgtSun = 1
SaveWbgtShade = 1
QuantizeNSD = 0

[Resolution]
longitude = 7200
latitude = 3600
; The ISIMIP3b input covers latitudes of about -56.25 to 83.75 only; keep
; lat_min/lat_max within this range. The example below covers Japan.
lon_min = 122.0
lon_max = 154.0
lat_min = 20.0
lat_max = 46.0

[FeatureFile]
FeatureList = ../input/input_features.txt
landmask = ../input/gridX/LandUse.sum.Type1.0.nc

[XgbModel]
air_temperature = ../input/xgb_models/xbg_model_air_temperature_variableset00_seed_0.json
relative_humidity = ../input/xgb_models/xbg_model_relative_humidity_variableset00_seed_0.json
station_pressure = ../input/xgb_models/xbg_model_station_pressure_variableset00_seed_0.json
wind_speed = ../input/xgb_models/xbg_model_wind_speed_variableset00_seed_0.json
